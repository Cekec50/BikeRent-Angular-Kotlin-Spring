<section class="min-vh-100 bg-bikerent">
  <div class="container py-5 h-100">
    <h1 class="text-white text-center brand-logo-big">
    BikeRent
    </h1>
  </div>
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card bg-grey-light text-black" style="border-radius: 1rem;">
          
          <div class="card-body p-5 text-center">

            <div class="mb-md-5 mt-md-2 ">

              <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
              <p class="text-black-50 mb-5">Please enter your login and password!</p>

              <form (ngSubmit)="login()">
                <div data-mdb-input-init class="form-outline form-white mb-4">
                  <input
                    type="email"
                    id="typeEmailX"
                    class="form-control form-control-lg"
                    placeholder="Email"
                    [(ngModel)]="username"
                    name="username"
                  />
                </div>

                <div data-mdb-input-init class="form-outline form-white mb-4">
                  <input
                    type="password"
                    id="typePasswordX"
                    class="form-control form-control-lg"
                    placeholder="Password"
                    [(ngModel)]="password"
                    name="password"
                  />
                </div>

                <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
                  {{ errorMessage }}
                </div>

                <button data-mdb-button-init data-mdb-ripple-init class="btn btn-lg px-5 bg-yellow" type="submit">Login</button>
              </form>

            </div>

            <div>
              <p class="mb-0">Don't have an account? <a  class="text-black-50 fw-bold" routerLink="/register" routerLinkActive="active">Sign Up</a>
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="py-5" *ngIf="user">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">

        <div class="card shadow-sm">
          <div class="card-body p-4">

            <h4 class="text-center mb-4 fw-bold">
              My Profile
            </h4>

            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>

            <form>

              <!-- First name -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  First Name
                </label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="user.firstName"
                  name="firstName"
                />
              </div>
              <!-- Last name -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Last Name
                </label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="user.lastName"
                  name="lastName"
                />
              </div>

              <!-- Username -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Username
                </label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="user.username"
                  name="username"
                />
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Email
                </label>
                <input
                  type="email"
                  class="form-control"
                  [(ngModel)]="user.email"
                  name="email"
                />
              </div>

              <!-- Phone -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Phone number
                </label>
                <input
                  type="tel"
                  class="form-control"
                  [(ngModel)]="user.phone"
                  name="phone"
                />
              </div>

              <hr class="my-4">

              <!-- Password -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  New password
                </label>
                <input
                  type="password"
                  class="form-control"
                  [(ngModel)]="newPassword"
                  name="newPassword"
                  placeholder="Leave empty to keep current password"
                />
              </div>

              <!-- Confirm password -->
              <div class="mb-4">
                <label class="form-label fw-semibold">
                  Confirm new password
                </label>
                <input
                  type="password"
                  class="form-control"
                  [(ngModel)]="confirmPassword"
                  name="confirmPassword"
                />
              </div>

              <!-- Actions -->
              <div class="d-grid">
                <button type="button" class="btn btn-success btn-lg" (click)="saveChanges()">
                  Save changes
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>

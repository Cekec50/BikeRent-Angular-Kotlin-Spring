<section class="py-5">
  <div class="container px-4 px-lg-5 mt-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">

      <!-- REPORT CARD -->
      <div class="col mb-5 " *ngFor="let report of reports" style="flex: 0 0 600px;">
        <div class="card h-100 ">

          <div class="row g-0 h-100">

            <!-- IMAGE -->
            <div class="col-3 d-flex align-items-center justify-content-center">
              <img
                [src]="report.photoUrl"
                alt="Bike issue photo"
                class="rental-image"
              />
            </div>

            <!-- CONTENT -->
            <div class="col-9">
              <div class="card-body p-4">

                <h5 class="fw-bolder text-center">
                  Bike #{{ report.bikeId }}
                </h5>

                <hr class="my-2">

                <p class="text-center mb-0 description-height">
                  {{ report.description }}
                </p>

              </div>

              <div class="card-footer p-3 border-top-0 bg-transparent">
                <div class="d-flex justify-content-center gap-2">
                  <button class="btn btn-primary px-4 py-1" (click)="sendToRepair(report)">
                    Send to repair
                  </button>
                  <button class="btn btn-danger px-4 py-1" (click)="removeReport(report.id)">
                    Remove
                  </button>
                </div>
              </div>
            </div>

          </div>

        </div>
      </div>

    </div>
  </div>
</section>

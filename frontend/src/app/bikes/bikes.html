

<section class="py-3">
    <div class="row mb-3 justify-content-center">
        <div class="col-md-4">
            <input type="text" 
                    class="form-control" 
                    placeholder="Search bikes ..." 
                    [(ngModel)]="searchTerm" 
                    (input)="filterBikes()">
        </div>
    </div>
    <div class="container px-4 px-lg-5 mt-5">
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
            <div class="col mb-5" *ngFor="let bike of filteredBikes">
                <div class="card ">
                    <!-- Product details-->
                    <div class="card-body p-4">
                        <div class="text-center">
                            <!-- Product name-->
                            <h5 class="fw-bolder">Bike #{{ bike.id }}</h5>
                            Type: {{ bike.type }} <br>
                            Price: {{ bike.price }} RSD/min <br>
                            Location: {{ bike.location }}<br>
                            Status: <span  
                                [ngClass]="{
                                            'text-success': bike.status === 1,
                                            'text-yellow': bike.status === 0,
                                            'text-danger': bike.status === -1,
                                            'fw-bold': true
                                            }"
                                    > {{ getStatusLabel(bike.status) }}</span >  <br>
                        </div>

                        <div class="card-footer p-3 border-top-0 bg-transparent">
                            <div class="d-flex justify-content-center gap-2">
                                <button class="btn btn-primary px-5 py-2" [routerLink]="['/bike-form', bike.id]">
                                Edit
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            
                
            
            <div class="col mb-5 d-flex align-items-center justify-content-center">
                <button class="btn btn-success px-2 py-4" [routerLink]="['/bike-form']">
                    + Add Bike
                </button>
            </div> 
            
        </div>
    </div>
</section>

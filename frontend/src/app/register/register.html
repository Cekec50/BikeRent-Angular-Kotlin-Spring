<section class="min-vh-100 bg-bikerent">
  <div class="container py-4 h-100">
    <h1 class="text-white text-center brand-logo-big">
    BikeRent
    </h1>
  </div>
  <div class="container py-3 h-200">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card bg-grey-light text-black" style="border-radius: 1rem;">
          <div class="card-body p-5 text-center">

            <div class="mb-md-5">

              <h2 class="fw-bold mb-2 text-uppercase">Register</h2>
              <p class="text-black-50 mb-5">Create your account!</p>

              <div data-mdb-input-init class="form-outline form-white mb-4">
                <input
                  type="text"
                  id="firstName"
                  class="form-control form-control-lg"
                  placeholder="First Name"
                  [(ngModel)]="firstname"
                />
              </div>

              <div data-mdb-input-init class="form-outline form-white mb-4">
                <input
                  type="text"
                  id="lastName"
                  class="form-control form-control-lg"
                  placeholder="Last Name"
                  [(ngModel)]="lastname"
                />
              </div>

              <div data-mdb-input-init class="form-outline form-white mb-4">
                <input
                  type="text"
                  id="username"
                  class="form-control form-control-lg"
                  placeholder="Username"
                  [(ngModel)]="username"
                />
              </div>

              <div data-mdb-input-init class="form-outline form-white mb-4">
                <input
                  type="email"
                  id="email"
                  class="form-control form-control-lg"
                  placeholder="Email"
                  [(ngModel)]="email"
                />
              </div>

              <div data-mdb-input-init class="form-outline form-white mb-4">
                <input
                  type="text"
                  id="phone"
                  class="form-control form-control-lg"
                  placeholder="Phone"
                  [(ngModel)]="phone"
                />
              </div>

              <div data-mdb-input-init class="form-outline form-white mb-4">
                <input
                  type="password"
                  id="password"
                  class="form-control form-control-lg"
                  placeholder="Password"
                  [(ngModel)]="password"
                />
              </div>

              <button data-mdb-button-init data-mdb-ripple-init class="btn  btn-lg px-5 bg-yellow" type="submit" (click)="register()">Register</button>

              <p *ngIf="debugMessage" class="mt-3 text-muted">
                {{ debugMessage }}
              </p>


            </div>

            <div>
              <p class="mb-0">Already have an account? <a class="text-black-50 fw-bold" routerLink="/login" routerLinkActive="active">Log In</a>
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

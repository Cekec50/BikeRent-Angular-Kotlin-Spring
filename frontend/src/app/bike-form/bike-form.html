<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">

        <div class="card shadow-sm">
          <div class="card-body p-4">

            <h4 class="text-center mb-4 fw-bold">
              {{ isEditMode ? 'Edit Bike #' + bikeId : 'Add New Bike' }}
            </h4>

            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>

            <form>
              <!-- Type -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Type <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="bike.type"
                  name="type"
                  required
                />
              </div>

              <!-- Price -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Price (RSD/min)
                </label>
                <input
                  type="number"
                  class="form-control"
                  [(ngModel)]="bike.price"
                  name="price"
                  min="0"
                  step="0.01"
                />
              </div>

              <!-- Location: text → geocode to latitude/longitude (Nominatim) -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Location <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="locationInput"
                    name="locationInput"
                    placeholder="e.g. Belgrade, Serbia or street address"
                  />
                  <button
                    type="button"
                    class="btn btn-outline-primary"
                    (click)="lookUpAddress()"
                    [disabled]="isLookingUp"
                  >
                    {{ isLookingUp ? 'Looking up...' : 'Look up' }}
                  </button>
                </div>
                <div *ngIf="lastLookedUpAddress" class="small text-success mt-1">
                  Found: {{ lastLookedUpAddress }}
                </div>
                <div class="small mt-1">
                  Latitude: {{ bike.latitude | number:'1.5-5' }} · Longitude: {{ bike.longitude | number:'1.5-5' }}
                </div>
              </div>

              <!-- Status -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Status
                </label>
                <select
                  class="form-select"
                  [(ngModel)]="bike.status"
                  name="status"
                >
                  <option [value]="1">Available</option>
                  <option [value]="0">Unavailable</option>
                  <option [value]="-1">Removed</option>
                </select>
              </div>

              <!-- Actions -->
              <div class="d-grid py-2">
                <button
                  type="button"
                  class="btn btn-success btn-lg"
                  (click)="saveBike()"
                >
                  {{ isEditMode ? 'Update' : 'Create' }}
                </button>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
